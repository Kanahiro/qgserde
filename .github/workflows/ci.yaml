name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
  qgis:
    name: QGIS ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.44"
            image: qgis/qgis:3.44
          - version: "4.0"
            image: qgis/qgis:4.0-trixie
          - version: "4.2"
            image: qgis/qgis:4.2-trixie
    env:
      QGIS_VERSION: ${{ matrix.version }}
      QGIS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate QGIS projects with qgserde
        run: node test/qgis/fixtures.ts "$RUNNER_TEMP/qgis-projects" "$QGIS_VERSION"
      - name: Pull QGIS
        run: docker pull "$QGIS_IMAGE"
      - name: Read projects in QGIS
        run: |
          docker run --rm --network none \
            --env QT_QPA_PLATFORM=offscreen \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/qgis-projects:/projects:ro" \
            --workdir /workspace \
            --entrypoint python3 \
            "$QGIS_IMAGE" test/qgis/verify-projects.py /projects "$QGIS_VERSION"
